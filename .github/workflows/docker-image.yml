name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: youki258/astro-koharu

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (dynamic target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dynamic
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            KOHARU_SUITE_URL=https://suite.youki.fun
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production (az)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull, recreate, health-gate, auto-rollback
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' << 'EOF'
          set -eu
          cd /opt/blog
          PREV=$(sudo docker images --format '{{.ID}}' ghcr.io/youki258/astro-koharu | head -1)
          echo "previous image: $PREV"
          sudo docker compose pull astro-koharu
          sudo docker compose up -d astro-koharu
          ok=0
          for i in $(seq 1 24); do
            status=$(sudo docker inspect -f '{{.State.Health.Status}}' astro-koharu 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "health check failed after 120s, rolling back to $PREV"
            sudo docker tag "$PREV" ghcr.io/youki258/astro-koharu:latest
            sudo docker compose up -d astro-koharu
            exit 1
          fi
          echo "deployed, container healthy"
          EOF
