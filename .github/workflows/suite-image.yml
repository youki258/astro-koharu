name: Build & Push koharu-suite Image

on:
  workflow_dispatch:
    inputs:
      suite_ref:
        description: 'koharu-suite branch/tag to build'
        default: 'main'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: youki258/koharu-suite

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout suite upstream
        uses: actions/checkout@v4
        with:
          repository: cosZone/koharu-suite
          ref: ${{ inputs.suite_ref || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            REVISION=${{ inputs.suite_ref || 'main' }}
            VERSION=suite-${{ inputs.suite_ref || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
